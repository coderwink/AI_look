<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23171717'/%3E%3Ctext x='16' y='22' font-size='15' text-anchor='middle' fill='white' font-family='sans-serif'%3E格%3C/text%3E%3C/svg%3E">
<title>素材库 · 型格 LOOKBOOK</title>
<style>
:root{
  --bg:#fafafa; --card:#ffffff; --ink:#171717; --ink2:#8a8a8a; --line:#ececec;
  --chip:#f2f2f2; --accent:#171717; --radius:12px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;line-height:1.5}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;border:0;background:none;cursor:pointer;color:inherit}

/* 顶栏 */
.topbar{position:sticky;top:0;z-index:20;background:rgba(250,250,250,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:720px;margin:0 auto;padding:14px 16px 10px}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.brand h1{font-size:19px;font-weight:700;letter-spacing:.5px}
.brand .meta{font-size:12px;color:var(--ink2)}
.brand .meta a{border-bottom:1px solid var(--line);padding-bottom:1px}
.search{margin-top:10px;display:flex;gap:8px}
.search input{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;font-size:14px;outline:none;color:var(--ink)}
.search input:focus{border-color:#c9c9c9}
.search .clear{border:1px solid var(--line);background:#fff;border-radius:10px;padding:0 14px;font-size:13px;color:var(--ink2)}

/* 标签云 */
.tags{max-width:720px;margin:0 auto;padding:10px 16px 2px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.tags::-webkit-scrollbar{display:none}
.tagchip{flex:0 0 auto;background:var(--chip);border-radius:999px;padding:5px 12px;font-size:12px;color:var(--ink2);white-space:nowrap}
.tagchip.on{background:var(--ink);color:var(--bg)}
.tagchip b{font-weight:600;color:inherit;opacity:.65;margin-left:3px;font-size:11px}
.hbar{max-width:720px;margin:0 auto;padding:6px 16px 10px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.hbar::-webkit-scrollbar{display:none}
.hbar .tagchip.on{background:#2b6cb0;color:#fff}
.sbar .tagchip.on{background:#3f7d5a;color:#fff}

/* 瀑布流 */
.feed{max-width:720px;margin:12px auto 80px;padding:0 12px;column-count:2;column-gap:10px}
@media(min-width:560px){.feed{column-count:3}}
.mcard{break-inside:avoid;margin-bottom:10px;background:var(--card);border-radius:var(--radius);overflow:hidden;border:1px solid var(--line);cursor:pointer;transition:transform .15s ease}
.mcard:active{transform:scale(.985)}
.mcard .cover{position:relative;background:#efefef}
.mcard .cover img{width:100%}
.mcard .vb{position:absolute;top:8px;right:8px;background:rgba(17,17,17,.72);color:#fff;font-size:10px;padding:2px 7px;border-radius:999px;letter-spacing:.5px}
.mcard .hb{position:absolute;top:8px;left:8px;background:rgba(43,108,176,.9);color:#fff;font-size:10px;padding:2px 7px;border-radius:999px;font-weight:600;letter-spacing:.3px}
.mcard .hb.soft{background:rgba(17,17,17,.5);font-weight:400}
.mcard .cnt{position:absolute;bottom:8px;right:8px;background:rgba(17,17,17,.72);color:#fff;font-size:10px;padding:2px 7px;border-radius:999px}
.mcard .pad{padding:9px 10px 11px}
.mcard .t{font-size:13px;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mcard .tg{margin-top:6px;display:flex;gap:4px;flex-wrap:wrap}
.mcard .tg span{font-size:10px;color:var(--ink2);background:var(--chip);border-radius:999px;padding:2px 7px;max-width:88px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mcard .ft{margin-top:7px;font-size:11px;color:var(--ink2);display:flex;justify-content:space-between}
.empty{max-width:720px;margin:60px auto;text-align:center;color:var(--ink2);font-size:14px}

/* 详情弹层 */
.layer{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;overscroll-behavior:contain}
.layer-in{max-width:640px;margin:0 auto;padding:14px 16px 60px}
.layer .close{position:sticky;top:12px;z-index:5;float:right;width:34px;height:34px;border-radius:50%;background:#fff;border:1px solid var(--line);font-size:16px;line-height:1}
.viewer{position:relative;border-radius:14px;overflow:hidden;background:#111}
.viewer img{width:100%;max-height:70vh;object-fit:contain;background:#111}
.viewer .nav{position:absolute;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.85);font-size:15px}
.viewer .nav.prev{left:10px}.viewer .nav.next{right:10px}
.viewer .dots{position:absolute;bottom:10px;left:0;right:0;text-align:center;color:#fff;font-size:11px;text-shadow:0 1px 2px rgba(0,0,0,.8)}
.m-title{font-size:18px;font-weight:700;margin-top:14px}
.m-sub{font-size:12px;color:var(--ink2);margin-top:4px}
.m-desc{font-size:14px;margin-top:10px;white-space:pre-wrap;color:#333}
.m-tags{margin-top:12px;display:flex;gap:6px;flex-wrap:wrap}
.m-tags span{font-size:12px;background:var(--chip);color:var(--ink2);border-radius:999px;padding:4px 11px;cursor:pointer}
.m-open{display:block;margin-top:16px;text-align:center;background:var(--ink);color:#fff;border-radius:10px;padding:11px;font-size:14px;font-weight:600}

/* 深色模式：跟随系统，只覆盖变量 */
@media (prefers-color-scheme: dark){
  :root{
    --bg:#121212; --card:#1b1b1c; --ink:#f2efea; --ink2:#a8a39b; --line:#2c2b28;
    --chip:#242426; --accent:#f2efea;
  }
  html{color-scheme:dark}
  .topbar{background:rgba(18,18,18,.92)}
  .search input{background:var(--card)}
  .search .clear{background:var(--card)}
  .mcard{border-color:var(--line)}
  .mcard .cover{background:var(--chip)}
  .m-desc{color:#d8d3cb}
  .m-open{color:#141414}
  .layer .close{background:var(--card)}
  .collect input,.collect select{background:var(--card)}
  .m-collect{background:var(--card);color:var(--ink);border-color:var(--ink)}
  .collect .row .primary{color:#141414}
}

/* 收录为搭配 */
.m-collect{display:block;width:100%;margin-top:8px;background:#fff;border:1px solid var(--ink);color:var(--ink);border-radius:10px;padding:11px;font-size:14px;font-weight:600}
.collect{margin-top:12px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px}
.collect label{display:block;font-size:11.5px;color:var(--ink2);margin-bottom:10px}
.collect input,.collect select{display:block;width:100%;margin-top:4px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:14px;color:var(--ink);background:#fafafa;font-family:inherit}
.collect .two{display:flex;gap:8px}
.collect .two label{flex:1;min-width:0}
.collect .row{display:flex;gap:8px}
.collect .row button{flex:1;padding:10px;border-radius:8px;font-size:13px;border:1px solid var(--line);background:#fff;color:var(--ink)}
.collect .row .primary{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:600}
.collect .hint{font-size:11px;color:var(--ink2);margin-top:9px;line-height:1.6}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-in">
    <div class="brand">
      <h1>素材库</h1>
      <span class="meta"><span id="count">–</span> 条 · <a href="./">返回穿搭 App</a></span>
    </div>
    <div class="search">
      <input id="q" type="search" placeholder="搜标题 / 文案 / 标签，如：西装、韩系、白色" autocomplete="off">
      <button class="clear" id="clear">清除</button>
    </div>
  </div>
  <div class="tags" id="tagbar"></div>
  <div class="hbar" id="heightbar"></div>
  <div class="hbar sbar" id="sourcebar"></div>
</header>

<main class="feed" id="feed"></main>
<div class="empty" id="empty" hidden>没有匹配的素材，换个关键词试试</div>

<div class="layer" id="layer" hidden>
  <div class="layer-in">
    <button class="close" id="close" aria-label="关闭">✕</button>
    <div class="viewer" id="viewer"></div>
    <div class="m-title" id="mTitle"></div>
    <div class="m-sub" id="mSub"></div>
    <div class="m-desc" id="mDesc"></div>
    <div class="m-tags" id="mTags"></div>
    <a class="m-open" id="mOpen" target="_blank" rel="noopener">在小红书查看原笔记 ↗</a>
    <button class="m-collect" id="mCollect">收录为搭配 →</button>
    <div class="collect" id="collect" hidden>
      <label>标题<input id="cTitle" maxlength="24" placeholder="如：166 小个子 · 短外套拉高腰线"></label>
      <div class="two">
        <label>风格<select id="cStyle"></select></label>
        <label>场景<select id="cScene"></select></label>
      </div>
      <div class="two">
        <label>适穿身高下限<input id="cMin" type="number" step="1" min="140" max="210"></label>
        <label>适穿身高上限<input id="cMax" type="number" step="1" min="140" max="210"></label>
      </div>
      <div class="row">
        <button id="cCancel">取消</button>
        <button id="cSave" class="primary">存为草稿</button>
      </div>
      <p class="hint" id="cMsg">草稿存在本机浏览器，回到穿搭 App 的「我的 → 我的草稿」可以预览和导出。</p>
    </div>
  </div>
</div>

<script>
const IMG = (id, f) => `../content/xhs/${id}/${f}`;
let DATA = [], shown = [], activeTag = '', activeHeight = '', activeSource = '', HEIGHTS = [], SOURCES = [], TAX = null, cur = null, curImg = 0;
const DRAFT_KEY = 'xingge.incoming.v1';

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const timeStr = t => { try { return new Date(t).toLocaleDateString('zh-CN'); } catch(e){ return ''; } };

async function init(){
  const [r, rt] = await Promise.all([
    fetch('../content/xhs/index.json'),
    fetch('../content/taxonomy.json').catch(() => null),
  ]);
  const j = await r.json();
  TAX = rt && rt.ok ? await rt.json() : null;
  DATA = j.notes || [];
  HEIGHTS = (j.heights || []).filter(h => h.count);
  SOURCES = (j.sources || []).filter(s => s.count);
  document.getElementById('count').textContent = DATA.length;
  buildHeightbar();
  buildSourcebar();
  buildTagbar();
  apply();
}

/* 来源筛选：博主主页 / 各搜索关键词 */
function buildSourcebar(){
  const bar = document.getElementById('sourcebar');
  if (SOURCES.length < 2) { bar.hidden = true; return; }
  bar.innerHTML = `<button class="tagchip on" data-s="">全部来源<b>${DATA.length}</b></button>`
    + SOURCES.map(s => `<button class="tagchip" data-s="${esc(s.file)}">${esc(s.label)}<b>${s.count}</b></button>`).join('');
  bar.onclick = e => {
    const b = e.target.closest('.tagchip'); if(!b) return;
    activeSource = b.dataset.s;
    bar.querySelectorAll('.tagchip').forEach(x=>x.classList.toggle('on', x===b));
    apply();
  };
}

function buildHeightbar(){
  const bar = document.getElementById('heightbar');
  const total = DATA.length;
  bar.innerHTML = `<button class="tagchip on" data-h="">全部身高<b>${total}</b></button>`
    + HEIGHTS.map(h => `<button class="tagchip" data-h="${h.key}">${h.label}${h.tag&&h.tag!=='未标注'?'·'+h.tag:''}<b>${h.count}</b></button>`).join('');
  bar.onclick = e => {
    const b = e.target.closest('.tagchip'); if(!b) return;
    activeHeight = b.dataset.h;
    bar.querySelectorAll('.tagchip').forEach(x=>x.classList.toggle('on', x===b));
    apply();
  };
}

function buildTagbar(){
  const freq = {};
  DATA.forEach(n => (n.tags||[]).forEach(t => {
    if (t === (DATA.author||'')) return;
    freq[t] = (freq[t]||0)+1;
  }));
  const top = Object.entries(freq).filter(([,c])=>c>=3).sort((a,b)=>b[1]-a[1]).slice(0,18);
  const bar = document.getElementById('tagbar');
  bar.innerHTML = `<button class="tagchip on" data-t="">全部</button>` + top.map(([t,c]) =>
    `<button class="tagchip" data-t="${esc(t)}">${esc(t)}<b>${c}</b></button>`).join('');
  bar.onclick = e => {
    const b = e.target.closest('.tagchip'); if(!b) return;
    activeTag = b.dataset.t;
    bar.querySelectorAll('.tagchip').forEach(x=>x.classList.toggle('on', x===b));
    apply();
  };
}

function apply(){
  const q = document.getElementById('q').value.trim().toLowerCase();
  shown = DATA.filter(n => {
    if (activeTag && !(n.tags||[]).includes(activeTag)) return false;
    if (activeHeight && (!n.height || n.height.band !== activeHeight)) return false;
    if (activeSource && n.sourceFile !== activeSource) return false;
    if (!q) return true;
    return (n.title + ' ' + n.desc + ' ' + (n.tags||[]).join(' ')).toLowerCase().includes(q);
  });
  document.getElementById('empty').hidden = shown.length > 0;
  render();
}

function render(){
  document.getElementById('feed').innerHTML = shown.map((n,i) => {
    const h = n.height || {};
    const hLabel = h.value ? `${h.value}` : (h.tag || '');
    const hCls = h.value ? 'hb' : 'hb soft';
    return `
    <article class="mcard" data-i="${i}">
      <div class="cover">
        <img loading="lazy" src="${IMG(n.id, n.cover)}" alt="" onerror="this.style.opacity=0">
        ${hLabel ? `<span class="${hCls}">${esc(hLabel)}${h.value ? 'cm' : ''}</span>` : ''}
        ${n.type==='video' ? '<span class="vb">视频</span>' : ''}
        ${n.images.length>1 ? `<span class="cnt">${n.images.length}图</span>` : ''}
      </div>
      <div class="pad">
        <div class="t">${esc(n.title || '（无标题）')}</div>
        <div class="tg">${(n.tags||[]).slice(0,3).map(t=>`<span>${esc(t)}</span>`).join('')}</div>
        <div class="ft"><span>${esc(n.author || timeStr(n.time))}</span><span>♡ ${esc(n.liked||'')}</span></div>
      </div>
    </article>`;}).join('');
}

/* 详情 */
function openDetail(i){
  cur = shown[i]; curImg = 0;
  closeCollect();
  renderViewer(); renderMeta();
  const l = document.getElementById('layer');
  l.hidden = false; l.scrollTop = 0;
  history.pushState({layer:true}, '');
}
function renderViewer(){
  const n = cur;
  document.getElementById('viewer').innerHTML = `
    <img src="${IMG(n.id, n.images[curImg])}" alt="">
    ${n.images.length>1 ? `<button class="nav prev" data-d="-1">‹</button><button class="nav next" data-d="1">›</button><div class="dots">${curImg+1} / ${n.images.length}</div>` : ''}`;
}
function renderMeta(){
  const n = cur;
  const h = n.height || {};
  const hText = h.value ? `适合 ${h.value}cm` : (h.tag || '');
  document.getElementById('mTitle').textContent = n.title || '（无标题）';
  document.getElementById('mSub').textContent = [hText, n.author, timeStr(n.time), n.type==='video'?'视频笔记':'图文笔记', '♡ '+(n.liked||''), n.sourceKind==='search' ? n.sourceLabel : ''].filter(Boolean).join(' · ');
  document.getElementById('mDesc').textContent = n.desc || '';
  document.getElementById('mTags').innerHTML = (n.tags||[]).map(t=>`<span>${esc(t)}</span>`).join('');
  document.getElementById('mOpen').href = n.url;
}
function closeLayer(){
  const l = document.getElementById('layer');
  if (l.hidden) return;
  l.hidden = true;
  if (history.state && history.state.layer) history.back();
}

/* ---------- 收录为搭配（写 localStorage 草稿，App 端可预览/导出） ---------- */
function plainText(s){
  return String(s || '').replace(/#[^\s#]+/g, ' ').replace(/\s+/g, ' ').trim();
}
function guessStyle(n){
  const q = ((n.title || '') + ' ' + plainText(n.desc)).toLowerCase();
  const rules = [
    ['business', ['西装','正装','职场','面试','领带']],
    ['smart', ['衬衫','半正式','约会']],
    ['techwear', ['机能','冲锋','户外','山系','防风']],
    ['street', ['街头','潮','球鞋','工装','阔形','廓形']],
    ['retro', ['复古','牛仔','vintage','美式','做旧']],
    ['minimal', ['极简','简约','黑白灰','同色系','基础款']],
    ['cityboy', ['日系','cityboy','宽松','叠穿','通勤']],
  ];
  const hit = rules.find(([, ws]) => ws.some(w => q.includes(w)));
  return hit ? hit[0] : 'cityboy';
}
function readDrafts(){
  try { const a = JSON.parse(localStorage.getItem(DRAFT_KEY) || '[]'); return Array.isArray(a) ? a : []; }
  catch(e){ return []; }
}
function writeDrafts(arr){
  try { localStorage.setItem(DRAFT_KEY, JSON.stringify(arr)); return true; }
  catch(e){ return false; }
}
function fillSelects(){
  const st = document.getElementById('cStyle');
  if (st.options.length) return;
  st.innerHTML = ((TAX && TAX.styles) || []).map(s => `<option value="${esc(s.key)}">${esc(s.label)}</option>`).join('');
  document.getElementById('cScene').innerHTML = ((TAX && TAX.scenes) || []).map(s => `<option value="${esc(s.key)}">${esc(s.label)}</option>`).join('');
}
function openCollect(){
  const n = cur; if (!n) return;
  fillSelects();
  const title = (n.title || '').trim();
  document.getElementById('cTitle').value = (title || plainText(n.desc).slice(0, 24)).slice(0, 24);
  const v = n.height && n.height.value;
  document.getElementById('cMin').value = v ? Math.max(140, v - 5) : '';
  document.getElementById('cMax').value = v ? Math.min(210, v + 6) : '';
  // 风格按文案关键词猜，场景同理，猜不中就留默认
  const st = guessStyle(n);
  if ([...document.getElementById('cStyle').options].some(o => o.value === st)) document.getElementById('cStyle').value = st;
  const q = ((n.title || '') + ' ' + plainText(n.desc)).toLowerCase();
  const guess = [['commute',['通勤','上班','职场','面试']],['date',['约会','相亲']],['trip',['旅行','出行','度假']],['party',['聚会','派对']],['daily',['日常','每天']]];
  const hit = guess.find(([, ws]) => ws.some(w => q.includes(w)));
  if (hit) document.getElementById('cScene').value = hit[0];
  document.getElementById('cMsg').textContent = '草稿存在本机浏览器，回到穿搭 App 的「我的 → 我的草稿」可以预览和导出。';
  document.getElementById('collect').hidden = false;
  document.getElementById('mCollect').hidden = true;
  document.getElementById('collect').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}
function closeCollect(){
  const box = document.getElementById('collect');
  if (box.hidden) return;
  box.hidden = true;
  document.getElementById('mCollect').hidden = false;
}
function saveDraft(){
  const n = cur; if (!n) return;
  const titleEl = document.getElementById('cTitle');
  const title = titleEl.value.trim();
  if (!title) { titleEl.focus(); return; }
  const min = parseInt(document.getElementById('cMin').value, 10);
  const max = parseInt(document.getElementById('cMax').value, 10);
  const clean = plainText(n.desc);
  const firstSentence = (clean.split(/[。！!？?；;]/)[0] || '').trim();
  const draft = {
    id: 'draft-' + n.id.slice(-10),
    title,
    summary: firstSentence.slice(0, 24),
    styles: [document.getElementById('cStyle').value],
    scenes: [document.getElementById('cScene').value],
    seasons: [],
    image: { src: 'xhs/' + n.id + '/' + n.cover, ratio: 0.75, alt: title, credit: n.author || '' },
    desc: (clean || title).slice(0, 220),
    items: [], palette: [], tip: '',
    tags: (n.tags || []).filter(t => t !== n.author && t.length <= 10).slice(0, 4),
    author: n.author || '素材库',
    status: 'draft',
    source: { noteId: n.id, url: n.url, label: n.sourceLabel || '' },
    createdAt: new Date().toISOString().slice(0, 10),
  };
  if (min && max && min < max) draft.heightFit = { min, max, note: '' };
  const arr = readDrafts();
  const i = arr.findIndex(d => d.source && d.source.noteId === n.id);
  if (i >= 0) arr[i] = draft; else arr.unshift(draft);
  if (!writeDrafts(arr)) { document.getElementById('cMsg').textContent = '保存失败：浏览器存储空间不足，先清理一些本地数据。'; return; }
  document.getElementById('cMsg').textContent = `已存入草稿箱（共 ${arr.length} 条）。回 App「我的 → 我的草稿」可预览、导出 JSON。`;
}

document.getElementById('feed').onclick = e => {  const c = e.target.closest('.mcard'); if(!c) return;
  openDetail(+c.dataset.i);
};
document.getElementById('viewer').onclick = e => {
  const b = e.target.closest('.nav'); if(!b) return;
  curImg = (curImg + +b.dataset.d + cur.images.length) % cur.images.length;
  renderViewer();
};
document.getElementById('close').onclick = closeLayer;
document.getElementById('mCollect').onclick = openCollect;
document.getElementById('cCancel').onclick = closeCollect;
document.getElementById('cSave').onclick = saveDraft;
document.getElementById('layer').onclick = e => {
  const t = e.target.closest('.m-tags span');
  if (t){ document.getElementById('q').value = t.textContent; apply(); closeLayer(); window.scrollTo({top:0}); }
};
document.getElementById('q').addEventListener('input', apply);
document.getElementById('clear').onclick = () => {
  document.getElementById('q').value = '';
  activeTag = ''; activeHeight = ''; activeSource = '';
  ['tagbar','heightbar','sourcebar'].forEach(id => {
    const chips = document.getElementById(id).querySelectorAll('.tagchip');
    chips.forEach((x, i) => x.classList.toggle('on', i === 0));
  });
  apply();
};
window.addEventListener('popstate', () => { document.getElementById('layer').hidden = true; });

init();
</script>
</body>
</html>
